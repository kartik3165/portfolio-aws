AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Backend for Portfolio Application (HTTP API)

Parameters:
  BlogsTable:
    Type: String
    Default: BlogsTable
  CommentsTable:
    Type: String
    Default: BlogCommentsTable
  SkillsTable:
    Type: String
    Default: SkillsTable
  ProjectsTable:
    Type: String
    Default: ProjectsTable
  ProfileTable:
    Type: String
    Default: ProfileTable
  RateLimitsTable:
    Type: String
    Default: RateLimitsTable

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.13
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: INFO
    Environment:
      Variables:
        BLOG_TABLE: !Ref BlogsTable
        COMMENTS_TABLE: !Ref CommentsTable
        SKILL_TABLE: !Ref SkillsTable
        PROJECTS_TABLE: !Ref ProjectsTable
        PROFILE_TABLE: !Ref ProfileTable
        RATE_LIMIT_TABLE: !Ref RateLimitsTable
        JWT_SECRET_PARAM: /portfolio/JWT_SECRET
        JWT_ISSUER: portfolio-api
        JWT_AUDIENCE: portfolio-admin
        ADMIN_EMAIL_PARAM: /portfolio/ADMIN_EMAIL
        ADMIN_PASSWORD_PARAM: /portfolio/ADMIN_PASSWORD
        BOOTSTRAP_SECRET_PARAM: /portfolio/BOOTSTRAP_SECRET
        TOTP_ENCRYPTION_KEY_PARAM: /portfolio/TOTP_ENCRYPTION_KEY
        R2_ACCOUNT_ID_PARAM: /portfolio/R2_ACCOUNT_ID
        R2_ACCESS_KEY_ID_PARAM: /portfolio/R2_ACCESS_KEY_ID
        R2_SECRET_ACCESS_KEY_PARAM: /portfolio/R2_SECRET_ACCESS_KEY
        R2_BUCKET_NAME_PARAM: /portfolio/R2_BUCKET_NAME
        R2_PUBLIC_BASE_URL_PARAM: /portfolio/R2_PUBLIC_BASE_URL

Resources:
  ServerlessHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - https://admin.kanbs.me
          - https://portfolio-frontend-admin.pages.dev
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
          - x-bootstrap-secret
        AllowCredentials: true
      RouteSettings:
        'POST /admin/login':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 10
        'POST /admin/login/totp':
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 10
        'POST /public/comment/{blogId}':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 50

  RateLimitsDynamoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref RateLimitsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: expires_at

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.main.handler
      Events:
        HttpApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ServerlessHttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlogsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CommentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SkillsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProfileTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitsTable
        - Statement:
            - Sid: SsmReadPortfolioParameters
              Effect: Allow
              Action:
                - ssm:GetParameters
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/portfolio/*"

Outputs:
  ApiUrl:
    Description: HTTP API endpoint URL
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
