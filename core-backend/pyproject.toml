[project]
name = "backend"
version = "0.1.0"
description = "Personal portfolio API — FastAPI on AWS Lambda"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kartik Nagare" }]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.42.34",
    "boto3-stubs[dynamodb]>=1.42.34",
    "cryptography>=46.0.3",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "mangum>=0.20.0",
    "pydantic-settings>=2.12.0",
    "pyotp>=2.8.0",
    "PyJWT>=2.10.1",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "starlette>=0.50.0",
    "uuid6>=2025.0.1",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=100"
